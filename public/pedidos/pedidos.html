<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pedidos -- Taverna 3D</title>
    <link rel="stylesheet" href="pedidos.css">
</head>
<body>

    <header>
        <h1>Taverna 3D</h1>
        <p>Sistema de Gestão de Pedidos</p>
    </header>

    <main>
        <h2>Cadastro de Pedidos</h2>

        <form id="formPedido">

            <label for="cliente">Cliente:</label>
            <select id="cliente" required>
                <option value="">Selecione um cliente</option>
            </select>

            <h3>Produtos do Pedido</h3>

            <div id="listaItens"></div>

            <button type="button" id="btnAdicionarProduto">
                + Adicionar produto
            </button>

            <p>
                <strong>Total do pedido: R$ <span id="total">0,00</span></strong>
            </p>

            <label for="dataPedido">Data do pedido:</label>
            <input type="date" id="dataPedido" required>

            <label>Status inicial:</label>
            <input type="text" value="Aguardando pagamento" disabled>

            <button type="submit">Cadastrar Pedido</button>
            <button type="reset">Limpar</button>
        </form>

        <p id="mensagem"></p>

        <hr>

        <h2>Pedidos cadastrados</h2>
        <div id="historicoPedidos">
            <p>Nenhum pedido cadastrado.</p>
        </div>

        <a href="../index.html">Voltar ao menu principal</a>
    </main>

    <script src="pedidos.js"></script>
</body>
</html>
