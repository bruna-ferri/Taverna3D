
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Clientes - Taverna 3D</title>
    <link rel="stylesheet" href="../style.css">
</head>
<body>

    <header>
        <h1>Taverna 3D</h1>
        <p>Sistema de Gestão de Pedidos</p>
    </header>

    <main>
        <h2>Cadastro de Clientes</h2>
        <p>Preencha os dados para cadastrar um novo cliente.</p>

        <form id="formCliente">
            <label for="nome">Nome completo:</label>
            <input type="text" id="nome" required>

            <label for="cpf">CPF:</label>
            <input type="text" id="cpf" maxlength="14"
                   placeholder="000.000.000-00" required>

            <label for="telefone">Telefone:</label>
            <input type="tel" id="telefone"
                   placeholder="(00) 00000-0000" required>

            <button type="submit">Cadastrar Cliente</button>
            <button type="reset">Limpar</button>
        </form>

        <p id="mensagem"></p>

        <a href="../index.html">Voltar ao menu principal</a>
    </main>

    <script src="clientes.js"></script>
</body>
</html>
