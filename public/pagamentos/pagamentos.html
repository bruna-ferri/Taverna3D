
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Pagamentos | Taverna 3D</title>
    <link rel="stylesheet" href="../style.css">
</head>
<body>

    <header>
        <h1>Taverna 3D</h1>
        <p>Sistema de Gestão de Pedidos</p>
    </header>

    <main>
        <h2>Registro de Pagamentos</h2>
        <p>Registre os pagamentos dos pedidos cadastrados.</p>

        <form id="formPagamento">

            <label for="pedido">Selecione o pedido:</label>
            <select id="pedido" required>
                <option value="">Selecione um pedido</option>
            </select>

            <div id="informacoesPedido"></div>

            <label for="valor">Valor do pagamento (R$):</label>
            <input
                type="number"
                id="valor"
                min="0.01"
                step="0.01"
                placeholder="Ex: 50.00"
                required
            >

            <label for="metodo">Forma de pagamento:</label>
            <select id="metodo" required>
                <option value="">Selecione uma forma</option>
                <option value="PIX">PIX</option>
                <option value="Dinheiro">Dinheiro</option>
                <option value="Cartão de crédito">Cartão de crédito</option>
                <option value="Cartão de débito">Cartão de débito</option>
                <option value="Transferência">Transferência</option>
            </select>

            <label for="dataPagamento">Data do pagamento:</label>
            <input type="date" id="dataPagamento" required>

            <button type="submit">Registrar Pagamento</button>
            <button type="reset">Limpar</button>

        </form>

        <p id="mensagem"></p>

        <hr>

        <h2>Histórico de Pagamentos</h2>
        <div id="historicoPagamentos"></div>

        <a href="../index.html">Voltar ao menu principal</a>
    </main>

    <script src="pagamentos.js"></script>
</body>
</html>
