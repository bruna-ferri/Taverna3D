<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Taverna 3D | Gestão de Pedidos</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=Figtree:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header class="topo">
      <div class="topo__conteudo">
        <h1>Taverna 3D</h1>
        <p>Sistema de gestão de pedidos</p>
      </div>
    </header>

    <main>
      <h2>Painel principal</h2>
      <p class="intro">Escolha uma área para começar.</p>

      <nav class="menu" aria-label="Áreas do sistema">
        <a href="clientes/clientes.html" class="card">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="12" cy="8" r="4" />
            <path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7" />
          </svg>
          <span class="card__titulo">Clientes</span>
          <span class="card__texto">Cadastro e contatos</span>
        </a>

        <a href="produtos/produtos.html" class="card">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M12 2 3 7v10l9 5 9-5V7l-9-5Z" />
            <path d="m3 7 9 5 9-5M12 12v10" />
          </svg>
          <span class="card__titulo">Produtos</span>
          <span class="card__texto">Catálogo, filamentos e preços</span>
        </a>

        <button type="button" class="card">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <rect x="5" y="3" width="14" height="18" rx="2" />
            <path d="M9 8h6M9 12h6M9 16h4" />
          </svg>
          <span class="card__titulo">Pedidos</span>
          <span class="card__texto">Fila de impressão e entregas</span>
        </button>
        <button type="button" class="card">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <rect x="3" y="6" width="18" height="13" rx="2" />
            <path d="M3 10h18M7 15h3" />
          </svg>
          <span class="card__titulo">Pagamentos</span>
          <span class="card__texto">Valores recebidos e pendentes</span>
        </button>
      </nav>
    </main>

    <script src="script.js"></script>
  </body>
</html>
