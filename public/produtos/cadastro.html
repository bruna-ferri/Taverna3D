
<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastro de Produtos | Taverna 3D</title>

  <link rel="stylesheet" href="../style.css">
  <link rel="stylesheet" href="cadastro.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">

</head>
<body>
  <header class="topo">
    <div class="topo__conteudo">
      <h1>Taverna 3D</h1>
      <p>Sistema de gestão de pedidos</p>
    </div>
  </header>

  <main>
    <a href="produtos.html">← Voltar para Produtos</a>

    <h2>Cadastro de Produtos</h2>
    <p class="intro">Preencha os dados do novo produto.</p>

    <form id="formProduto">
      <label for="nome">Nome do produto:</label>
      <input type="text" id="nome" required>

      <label for="categoria">Categoria:</label>
      <select id="categoria" required>
        <option value="">Selecione</option>
        <option>Chaveiros</option>
        <option>Miniaturas</option>
        <option>Decoração</option>
        <option>Personalizados</option>
        <option>Outros</option>
      </select>

      <label for="descricao">Descrição:</label>
      <textarea id="descricao" rows="4"></textarea>

      <label for="preco">Preço (R$):</label>
      <input type="number" id="preco" min="0" step="0.01" required>

      <label for="estoque">Quantidade em estoque:</label>
      <input type="number" id="estoque" min="0" step="1" required>

      <div>
        <button type="submit">Cadastrar Produto</button>
        <button type="reset">Limpar</button>
      </div>
    </form>

    <p id="mensagem" role="status"></p>
  </main>

  <script src="cadastro.js"></script>
</body>
</html>
